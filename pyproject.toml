[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mplextras"
version = "0.1.0"
description = "A minimal package with extra functions to plot histograms with matplotlib."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/AlvaroEzq/mplextras"